# ML Media Vault - Cofre de mídias dos anúncios do Mercado Livre
# Sobe tudo com:  docker compose up -d --build
# Acesse em:      http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    container_name: mlvault-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlvault_pass}
      POSTGRES_DB: ${POSTGRES_DB:-mlvault}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlvault}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: ./backend
    container_name: mlvault-app
    # Chromium precisa de memória compartilhada > 64MB pra não travar
    shm_size: '2gb'
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mlvault}:${POSTGRES_PASSWORD:-mlvault_pass}@db:5432/${POSTGRES_DB:-mlvault}
      MEDIA_DIR: /data/media
      USER_AGENT: ${USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36}
    volumes:
      - ./data/media:/data/media   # mídias ficam no seu disco
      - ./backend/app:/app/app     # hot-reload em desenvolvimento
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
